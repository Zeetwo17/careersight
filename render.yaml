services:
  - type: web
    name: careersight
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && python -c "import matplotlib; matplotlib.get_cachedir(); import matplotlib.pyplot"
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false          # you fill this in on the Render dashboard
      - key: OPENROUTER_MODEL
        value: openai/gpt-oss-120b:free
      - key: KMP_DUPLICATE_LIB_OK
        value: "TRUE"
      - key: MPLBACKEND
        value: "Agg"
      - key: MPLCONFIGDIR
        value: "/tmp/matplotlib"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
